# CI — syntax, registry, and service-worker checks. No dependencies to install.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so check-sw.mjs can diff against origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # .js files without a package.json parse as CommonJS, so pipe each file
      # through stdin with an explicit module type to syntax-check it as ESM.
      - name: Syntax-check every module as ESM
        run: |
          set -eu
          for f in $(git ls-files '*.js' '*.mjs'); do
            node --input-type=module --check < "$f" || { echo "Syntax error in $f"; exit 1; }
          done

      - name: Smoke-load the game and theme registries
        run: node tools/smoke.mjs

      - name: Verify the service-worker precache
        run: node tools/check-sw.mjs
